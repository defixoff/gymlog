<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual">
<meta property="og:title" content="GymLog — дневник тренировок">
<meta property="og:description" content="Расписание, подходы, таймер отдыха, рекорды и прогресс. Работает офлайн.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<meta name="description" content="GymLog — дневник тренировок: расписание, подходы, таймер отдыха, рекорды и прогресс.">
<meta name="theme-color" content="#FF7A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="color-scheme" content="light dark">
<title>GymLog — дневник тренировок</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  /* тема до первой отрисовки — без вспышки светлого фона */
  try{var t=localStorage.getItem('gymlog.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
</script>
</head>
<body class="booting">

<!-- анимированный фон -->
<div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- SPLASH -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-logo">
    <svg viewBox="0 0 64 64" class="splash-bar" aria-hidden="true">
      <rect class="sb plate l1" x="6"  y="20" width="7"  height="24" rx="3"/>
      <rect class="sb plate l2" x="15" y="14" width="7"  height="36" rx="3"/>
      <rect class="sb bar"      x="22" y="29" width="20" height="6"  rx="3"/>
      <rect class="sb plate r2" x="42" y="14" width="7"  height="36" rx="3"/>
      <rect class="sb plate r1" x="51" y="20" width="7"  height="24" rx="3"/>
    </svg>
    <div class="splash-word"><span>G</span><span>y</span><span>m</span><span>L</span><span>o</span><span>g</span></div>
  </div>
</div>

<!-- ЭКРАН ВХОДА -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><span class="brand-dot" aria-hidden="true"></span>GymLog</div>
    <p class="auth-sub">Дневник тренировок — ваш прогресс всегда с вами</p>
    <div class="seg" id="authTabs" role="tablist">
      <span class="seg-pill" aria-hidden="true"></span>
      <button type="button" class="seg-btn on" id="tabLogin" role="tab" aria-selected="true">Вход</button>
      <button type="button" class="seg-btn" id="tabReg" role="tab" aria-selected="false">Регистрация</button>
    </div>
    <form id="authForm" novalidate>
      <label class="field"><span>Логин</span>
        <input id="aLogin" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="латиница, цифры, . _ -" required>
      </label>
      <label class="field"><span>Пароль</span>
        <div class="pass-wrap">
          <input id="aPass" type="password" autocomplete="current-password" placeholder="••••••" required>
          <button type="button" class="pass-toggle" id="passEye" aria-label="Показать пароль" aria-pressed="false"></button>
        </div>
      </label>
      <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>
      <button class="btn primary wide big" id="authSubmit" type="submit"><span class="btn-label">Войти</span><span class="btn-spinner" aria-hidden="true"></span></button>
    </form>
    <button class="link-btn" id="guestBtn" type="button">Продолжить без аккаунта →</button>
  </div>
</div>

<div class="layout">

<aside class="sidebar">
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span>GymLog</div>
  <nav class="side-nav" id="sideNav">
    <span class="side-pill" aria-hidden="true"></span>
  </nav>
  <div class="side-foot">
    <button id="themeBtnSide" class="icon-btn theme-btn" type="button" aria-label="Сменить тему"></button>
    <span class="sync-dot" id="syncDotSide" title="Синхронизация"></span>
  </div>
</aside>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>GymLog</div>
    <div class="topbar-right">
      <span class="sync-dot" id="syncDot" title="Синхронизация"></span>
      <button id="themeBtn" class="icon-btn theme-btn" type="button" aria-label="Сменить тему"></button>
    </div>
  </header>

  <main id="screens">
    <section id="screen-home" class="screen"></section>
    <section id="screen-analytics" class="screen"></section>
    <section id="screen-schedule" class="screen"></section>
    <section id="screen-workout" class="screen"></section>
    <section id="screen-profile" class="screen"></section>
  </main>
</div>

</div><!-- /layout -->

<div class="dock" id="dock">
  <!-- таймер отдыха: отдельная карточка над вкладками -->
  <section class="rest" id="rest" hidden aria-live="off">
    <div class="rest-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rest-track" cx="50" cy="50" r="42"/><circle class="rest-prog" id="restProg" cx="50" cy="50" r="42"/></svg>
      <span class="rest-dot"></span>
    </div>
    <div class="rest-mid">
      <div class="rest-time" id="restTime">1:30</div>
      <div class="rest-bar"><i id="restBar"></i></div>
    </div>
    <div class="rest-btns">
      <button type="button" class="rest-btn" data-rest="-15" aria-label="Минус 15 секунд">−15</button>
      <button type="button" class="rest-btn" data-rest="+15" aria-label="Плюс 15 секунд">+15</button>
      <button type="button" class="rest-btn x" data-rest="stop" aria-label="Остановить">✕</button>
    </div>
  </section>
  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <div class="tabs" id="tabs"><span class="tab-pill" aria-hidden="true"></span></div>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-ico"></span><span class="toast-msg"></span><i class="toast-bar"></i></div>

<script src="vendor/motion.js"></script>
<script src="vendor/confetti.js"></script>
<script src="app.js"></script>
</body>
</html>
